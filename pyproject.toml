[project]
name = "pmos"
version = "0.1.0"
description = "Unified collector for State Grid PMOS electricity-market sites"
requires-python = ">=3.11"
dependencies = ["playwright>=1.48", "olefile>=0.47"]

[project.scripts]
pmos = "pmos.cli:main"

[tool.setuptools]
packages = ["pmos", "pmos.browser", "pmos.adapters"]

<!doctype html>
<!-- Offline stand-in for the Shanxi announcement column page: chHeader mounts
     operationOrganizationQuery on sendDataToMain; opening its detail dialog loads
     a chunk that brings the file helper (webpack module 63a1) and mounts
     unstructedMessage, whose fileDownload(attachment) downloads through 63a1.a. -->
<html><head><meta charset="utf-8"><title>publication fixture</title></head>
<body><div id="app"></div>
<script>
const modules = {}, cache = {};
function require(id) {
  if (!(id in modules)) throw new Error("Cannot find module '" + id + "'");
  if (!cache[id]) { const m = {exports: {}}; cache[id] = m; modules[id](m, m.exports, require); }
  return cache[id].exports;
}
window.webpackJsonp = [];
window.webpackJsonp.push = chunk => { Object.assign(modules, chunk[1]); (chunk[2] || []).forEach(e => require(e[0])); return 0; };
const root = {$options: {name: 'App'}, $children: []};
const bus = {$emit(name, payload) {
  if (name === 'sendDataToMain' && !root.$children.some(v => v.viewId === payload.viewId)) root.$children.push(view(payload));
}};
// Like the real app, the header mounts a moment after the frame has loaded.
setTimeout(() => root.$children.push({$options: {name: 'chHeader'}, $children: [], $EventBus: bus, marketHeader: '',
                                      async setConfig() {}, async getValues() { this.marketHeader = 'PHBSX'; }}), 400);
function view(payload) {
  const vm = {$options: {name: 'operationOrganizationQuery'}, $children: [], viewId: payload.viewId,
              detailComponent: '', isfullscreen: false, messagePropData: {}, visible: false};
  Object.defineProperty(vm, 'dialogTableVisible', {get() { return this.visible; }, set(value) {
    this.visible = value;
    if (!value) return;
    const script = document.createElement('script');
    script.src = 'detail_chunk.js?' + Date.now();
    script.onload = () => {
      vm.$children = [{$options: {name: vm.detailComponent}, $children: [], ...vm.messagePropData,
                       fileDownload(t) { return require('63a1').a(t.id, null); }}];
    };
    document.head.appendChild(script);
  }});
  return vm;
}
document.getElementById('app').__vue__ = root;
</script></body></html>

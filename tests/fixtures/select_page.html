<!doctype html>
<!-- Offline stand-in for an Anhui one-dropdown report: a date input and an
     Element UI select whose items carry their ElOption value on __vue__. One
     option's value is an internal ID, not its text. -->
<html><head><meta charset="utf-8"><title>select fixture</title>
<style>.hidden { display: none; }</style></head>
<body>
<div class="el-form-item"><label>日期</label><input placeholder="选择日期" id="date"></div>
<div class="el-form-item"><label>断面名称</label><div class="el-select"><input readonly id="pick" value="甲线"></div></div>
<div class="el-select-dropdown hidden" id="drop"></div>
<button id="query">查询</button>
<script>
window.queries = 0;
document.getElementById('query').onclick = () => { window.queries += 1; };
const options = [["甲线", "甲线"], ["乙线", "乙线"], ["丙机", "3378262674776260623"]];
const drop = document.getElementById('drop');
for (const [text, value] of options) {
  const item = document.createElement('div'); item.className = 'el-select-dropdown__item'; item.textContent = text;
  item.__vue__ = {value}; drop.append(item);
  item.onclick = () => { if (drop.dataset.fading) return; pick.value = text; drop.classList.add('hidden'); };
}
const pick = document.getElementById('pick');
// ?toggle: as Element UI's select, a click on the open dropdown closes it, and its items stay visible while it fades
// out, not answering clicks (Anhui r19 15:48:20, form_value_not_committed after a failed bootstrap left it open).
pick.onclick = () => {
  if (!location.search.includes('toggle')) return drop.classList.remove('hidden');
  if (drop.classList.contains('hidden')) { drop.dataset.fading = ''; return drop.classList.remove('hidden'); }
  drop.dataset.fading = '1'; setTimeout(() => { drop.classList.add('hidden'); drop.dataset.fading = ''; }, 300);
};
pick.onkeydown = e => { if (e.key === 'Escape') drop.classList.add('hidden'); };
</script></body></html>

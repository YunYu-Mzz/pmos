<!doctype html>
<!-- Offline stand-in for a filterable Element UI select (Anhui 2026-11-01 11:31,
     各类电源类型电量及台数): while the dropdown is open the input shows nothing
     and the selected label moves to the placeholder; after Escape the label
     comes back one tick later, as ElSelect's visible watcher does. The model
     value never changes unless ?change=1 (a page that really changes it). -->
<html><head><meta charset="utf-8"><title>filterable select fixture</title>
<style>.hidden { display: none; }</style></head>
<body>
<div class="el-form-item"><label>日期</label><input placeholder="选择日期" id="date"></div>
<div class="el-form-item"><label>电源类型</label>
  <div class="el-select" id="select"><div class="el-input"><input id="pick" placeholder="请选择" value="火电"></div></div></div>
<div class="el-select-dropdown hidden" id="drop"></div>
<script>
window.queries = 0;
const change = location.search.includes('change=1');
const vm = {$options: {name: 'ElSelect'}, value: '火电'};
document.getElementById('select').__vue__ = vm;
const drop = document.getElementById('drop');
for (const text of ['火电', '水电', '风电']) {
  const item = document.createElement('div'); item.className = 'el-select-dropdown__item'; item.textContent = text;
  item.__vue__ = {value: text}; drop.append(item);
}
const pick = document.getElementById('pick');
pick.onclick = () => { drop.classList.remove('hidden'); pick.placeholder = pick.value; pick.value = ''; };
pick.onkeydown = e => {
  if (e.key !== 'Escape') return;
  drop.classList.add('hidden');
  if (change) vm.value = '水电';
  setTimeout(() => { pick.value = vm.value; pick.placeholder = '请选择'; }, 150);
};
</script></body></html>
